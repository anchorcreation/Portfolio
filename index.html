    <script type="text/javascript">
        (function () {
            // Keyboard control variables
            let currentSlide = 0;
            let isKeyboardControlActive = false;
            let originalAnimationTimeouts = [];
            let keyboardControlTimeouts = [];
            
            // Define slide configurations
            const slides = [
                {
                    // Slide 1 - corresponds to dot 1 (img_132)
                    elements: ['img_114', 'img_115'], // t1a, t1b
                    dot: 'img_132',
                    duration: 3000 // First slide duration
                },
                {
                    // Slide 2 - corresponds to dot 2 (img_133) 
                    elements: ['img_115'], // t1b
                    dot: 'img_133',
                    duration: 3000 // Second slide duration
                },
                {
                    // Slide 3 - corresponds to dot 3 (img_135)
                    elements: ['img_111'], // t1c
                    dot: 'img_135',
                    duration: 3000 // Third slide duration
                }
            ];

            function clearAllTimeouts() {
                originalAnimationTimeouts.forEach(timeout => clearTimeout(timeout));
                keyboardControlTimeouts.forEach(timeout => clearTimeout(timeout));
                originalAnimationTimeouts = [];
                keyboardControlTimeouts = [];
            }

            function resetAllAnimations() {
                // Reset all slide elements
                const allSlideElements = ['img_114', 'img_115', 'img_111'];
                allSlideElements.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.className = '';
                        element.style.opacity = '0';
                    }
                });

                // Reset all dots
                const allDots = ['img_132', 'img_133', 'img_135'];
                allDots.forEach(id => {
                    const dot = document.getElementById(id);
                    if (dot) {
                        dot.className = '';
                        dot.style.opacity = '0.5';
                        dot.style.transform = 'scale(1)';
                    }
                });
            }

            function showSlide(slideIndex) {
                if (slideIndex < 0 || slideIndex >= slides.length) return;
                
                clearAllTimeouts();
                resetAllAnimations();
                
                const slide = slides[slideIndex];
                
                // Show current slide elements
                slide.elements.forEach(elementId => {
                    const element = document.getElementById(elementId);
                    if (element) {
                        element.className = 'bnfy-enter';
                        element.style.opacity = '1';
                    }
                });

                // Activate current dot
                const currentDot = document.getElementById(slide.dot);
                if (currentDot) {
                    currentDot.className = 'bnfy-enter';
                    currentDot.style.opacity = '1';
                    currentDot.style.transform = 'scale(1.2)';
                }

                // Set inactive state for other dots
                const allDots = ['img_132', 'img_133', 'img_135'];
                allDots.forEach(dotId => {
                    if (dotId !== slide.dot) {
                        const dot = document.getElementById(dotId);
                        if (dot) {
                            dot.style.opacity = '0.5';
                            dot.style.transform = 'scale(1)';
                        }
                    }
                });

                currentSlide = slideIndex;
            }

            function nextSlide() {
                const nextIndex = (currentSlide + 1) % slides.length;
                showSlide(nextIndex);
            }

            function previousSlide() {
                const prevIndex = (currentSlide - 1 + slides.length) % slides.length;
                showSlide(prevIndex);
            }

            function handleKeyPress(event) {
                // Only activate keyboard control when user first presses arrow keys
                if (!isKeyboardControlActive && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
                    isKeyboardControlActive = true;
                    // Start with slide 0 when keyboard control is activated
                    showSlide(0);
                }

                if (isKeyboardControlActive) {
                    switch (event.key) {
                        case 'ArrowUp':
                            event.preventDefault();
                            nextSlide();
                            break;
                        case 'ArrowDown':
                            event.preventDefault();
                            previousSlide();
                            break;
                    }
                }
            }

            function onImagesLoaded(container, event) {
                var preloads = [];
                preloads.push.apply(preloads, container.getElementsByTagName("img"));
                preloads.push.apply(preloads, container.getElementsByTagName("lottie-player"));
                preloads.push.apply(preloads, container.getElementsByTagName("video"));
                var loaded = preloads.length;
                
                for (var i = 0; i < preloads.length; i++) {
                    var tag = preloads[i].tagName.toLowerCase();
                    if (tag === "lottie-player") {
                        preloads[i].addEventListener("ready", function () {
                            loaded--;
                            if (loaded == 0) { event(); }
                        });
                    } else if (tag === "video") {
                        preloads[i].addEventListener('loadeddata', function () {
                            loaded--;
                            if (loaded == 0) { event(); }
                        }, false);
                    } else if (tag === "img") {
                        if (preloads[i].complete) {
                            loaded--;
                        } else {
                            preloads[i].addEventListener("load", function () {
                                loaded--;
                                if (loaded == 0) { event(); }
                            });
                        }
                        if (loaded == 0) { event(); }
                    }
                }
            }

            onImagesLoaded(document.getElementById("b_13"), function () {
                var elements = document.getElementById("b_13").getElementsByClassName('js-bnfy');
                for (var i = 0; i < elements.length; i++) {
                    elements[i].style.display = 'block';
                }

                // Original animation sequence (only runs if keyboard control is not active)
                function handleExits() {
                    if (isKeyboardControlActive) return;

                    var el_img_135 = document.getElementById("img_135");
                    var el_img_133 = document.getElementById("img_133");
                    var el_img_132 = document.getElementById("img_132");
                    var el_img_42 = document.getElementById("img_42");
                    var el_img_111 = document.getElementById("img_111");
                    var el_img_115 = document.getElementById("img_115");
                    
                    el_img_115.className = "bnfy-enter";
                    var timeout1 = setTimeout(function () {
                        if (!isKeyboardControlActive) {
                            el_img_115.className = '';
                            void el_img_115.offsetWidth;
                            el_img_115.className = "bnfy-exit";
                        }
                    }, 6000);
                    originalAnimationTimeouts.push(timeout1);

                    var el_img_114 = document.getElementById("img_114");
                    el_img_114.className = "bnfy-enter";
                    var timeout2 = setTimeout(function () {
                        if (!isKeyboardControlActive) {
                            el_img_114.className = '';
                            void el_img_114.offsetWidth;
                            el_img_114.className = "bnfy-exit";
                        }
                    }, 3000);
                    originalAnimationTimeouts.push(timeout2);

                    var el_img_110 = document.getElementById("img_110");
                    var el_img_16 = document.getElementById("img_16");
                    var el_img_15 = document.getElementById("img_15");
                    var el_img_118 = document.getElementById("img_118");
                    var el_img_113 = document.getElementById("img_113");
                    var el_img_117 = document.getElementById("img_117");
                    var el_img_13 = document.getElementById("img_13");
                }
                
                handleExits();
            });

            // Add keyboard event listeners
            document.addEventListener('keydown', handleKeyPress);
            
            // Make banner focusable for keyboard events
            const banner = document.getElementById('b_13');
            banner.addEventListener('click', function() {
                banner.focus();
                window.open(window.clickTag);
            });
            
            // Focus on banner when page loads
            window.addEventListener('load', function() {
                banner.focus();
            });
        })();
    </script>
